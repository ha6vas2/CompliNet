rules:

  - id: SYS-001
    name: Hostname configured
    description: Device must have a hostname configured.
    type: required
    config: "hostname "
    match: contains
    scope: all
    severity: medium
    remediation: "Restore the approved hostname."

  - id: SYS-002
    name: Informational logging
    description: Informational syslog logging must be configured.
    type: required
    config: "log syslog informational"
    match: exact
    scope: all
    severity: low
    remediation: "Configure informational syslog logging."

  - id: SYS-003
    name: IPv6 forwarding disabled
    description: IPv6 forwarding must remain disabled.
    type: required
    config: "no ipv6 forwarding"
    match: exact
    scope: all
    severity: low
    remediation: "Disable IPv6 forwarding."

  - id: OSPF-001
    name: OSPF enabled
    description: OSPF must be configured.
    type: required
    config: "router ospf"
    match: exact
    scope: all
    severity: critical
    remediation: "Restore the OSPF process."

  - id: OSPF-002
    name: OSPF Area 0 network
    description: The inter-router network must participate in OSPF Area 0.
    type: required
    config: "network 10.0.12.0/30 area 0"
    match: exact
    scope: all
    severity: critical
    remediation: "Restore the required OSPF Area 0 network statement."

  - id: OSPF-003
    name: R1 OSPF router ID
    description: R1 must use router ID 1.1.1.1.
    type: required
    config: "ospf router-id 1.1.1.1"
    match: exact
    scope: R1
    severity: high
    remediation: "Restore OSPF router ID 1.1.1.1."

  - id: OSPF-004
    name: R2 OSPF router ID
    description: R2 must use router ID 2.2.2.2.
    type: required
    config: "ospf router-id 2.2.2.2"
    match: exact
    scope: R2
    severity: high
    remediation: "Restore OSPF router ID 2.2.2.2."
